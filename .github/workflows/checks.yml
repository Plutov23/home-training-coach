name: Training timeline checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  timeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node trainer/tools/test-core.cjs
